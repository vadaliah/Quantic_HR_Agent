services:
  - type: web
    name: quantic-hr-api
    runtime: python
    plan: free
    buildCommand: |
      pip install uv
      uv sync --frozen
    startCommand: uv run uvicorn quantic_hr.bff:app --app-dir src --host 0.0.0.0 --port $PORT
    envVars:
      - key: AWS_REGION
        value: us-east-2
      - key: BEDROCK_CHAT_INFERENCE_PROFILE
        value: us.amazon.nova-pro-v1:0
      - key: BEDROCK_EMBEDDING_MODEL
        value: amazon.titan-embed-text-v2:0
      - key: CLUSTER_ARN
        sync: false
      - key: SECRET_ARN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: QUANTIC_ALLOW_AWS_DEPLOY
        value: "no"

  - type: web
    name: quantic-hr-ui
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false
