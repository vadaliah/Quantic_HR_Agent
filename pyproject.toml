[project]
name = "quantic-hr-agent"
version = "0.1.0"
description = "Local OSS spine for the Quantic HR agent (MCP + LangGraph + FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "langgraph>=0.6",
  "mcp>=1.12,<2",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "uvicorn>=0.35",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
