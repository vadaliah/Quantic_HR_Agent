name: infrastructure

on:
  push:
  pull_request:

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s runtime/hello_world -p 'test_*.py'

  cdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run synth
