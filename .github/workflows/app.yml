name: app

on:
  push:
  pull_request:

jobs:
  local-spine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: quantic
          POSTGRES_PASSWORD: quantic
          POSTGRES_DB: quantic_hr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantic -d quantic_hr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://quantic:quantic@127.0.0.1:5432/quantic_hr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run python scripts/apply_local_schema.py
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
