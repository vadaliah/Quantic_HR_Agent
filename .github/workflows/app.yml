name: app

on:
  push:
  pull_request:

# No database and no AWS here: Aurora is not reachable from a GitHub runner.
# The database-backed checks live in a separate on-demand workflow.

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --group dev
        
      - name: Tests
        run: uv run pytest -q

      - name: Import check
        run: |
          uv run python -c "import quantic_hr.bff, quantic_hr.agent, quantic_hr.tools, quantic_hr.mcp_server, quantic_hr.db"
        env:
          PYTHONPATH: src

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        run: |
          npm ci
          npm run build
        working-directory: frontend
